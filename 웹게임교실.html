window.WEBGAME_DEMO_HTML = "<!doctype html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<meta name=\"color-scheme\" content=\"light\">\n<title>별 잡기</title>\n<style>\n:root{font-family:system-ui,-apple-system,\"Malgun Gothic\",sans-serif;color:#151515;background:#e8b62c;font-synthesis:none}\n*{box-sizing:border-box}\nbody{margin:0;padding:10px;min-width:280px}\nmain{max-width:720px;margin:0 auto}\nh1{font-size:clamp(24px,6vw,34px);line-height:1;margin:0}\nheader{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}\n.tag{font-size:12px;font-weight:800;border:2px solid;background:white;padding:4px 7px;white-space:nowrap}\n.panel{background:white;border:3px solid;box-shadow:4px 4px 0 #151515;padding:10px}\n.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin-bottom:8px}\n.stat{text-align:center;border:2px solid;padding:4px 1px;background:#fff}\n.stat span{display:block;font-size:11px;font-weight:700}\n.stat strong{display:block;font-size:21px;line-height:1.2;font-variant-numeric:tabular-nums}\n.settings{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px;font-weight:800}\nselect,button{font:inherit;color:inherit;border:2px solid #151515;border-radius:0}\nselect{min-height:48px;flex:1;min-width:0;background:white;padding:5px}\n.controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-bottom:9px}\n.controls button{min-height:48px;background:#e8b62c;font-weight:800;box-shadow:2px 2px 0 #151515;cursor:pointer;padding:4px}\n.controls button:active:not(:disabled){transform:translate(2px,2px);box-shadow:none}\nbutton:disabled{opacity:.48;cursor:not-allowed}\nbutton:focus-visible,select:focus-visible{outline:3px solid #164bb5;outline-offset:3px}\n#field{height:clamp(145px,32vh,300px);position:relative;border:2px solid;background:#f7f5ed;overflow:hidden;isolation:isolate}\n#field::before{content:\"별을 누르세요\";position:absolute;inset:0;display:grid;place-items:center;color:#777;font-size:14px;font-weight:700;pointer-events:none}\n#field.playing::before{content:\"\"}\n#target{position:absolute;left:0;top:0;width:58px;height:58px;padding:7px;background:#e8b62c;box-shadow:3px 3px 0 #151515;cursor:pointer;touch-action:manipulation;z-index:1}\n#target svg{display:block;width:100%;height:100%;pointer-events:none}\n#target[hidden]{display:none}\n#status{font-size:13px;font-weight:700;min-height:36px;line-height:1.35;margin:8px 0 0}\ndetails{font-size:12px;line-height:1.5;margin-top:10px}\nsummary{cursor:pointer;font-weight:800;min-height:28px}\ndetails p{margin:4px 0}\n@media(max-height:540px){body{padding:7px}header{margin-bottom:6px}h1{font-size:24px}.panel{padding:7px}.stat{padding:2px 1px}.stat span{font-size:10px}.stat strong{font-size:18px}.settings{margin-bottom:5px}select{min-height:48px}#field{height:128px}.stats{margin-bottom:5px}.controls{margin-bottom:6px}#status{margin-top:5px;min-height:34px;font-size:12px}details{margin-top:7px}}\n@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.controls button:active:not(:disabled){transform:none}}\n</style>\n</head>\n<body>\n<main>\n<header><h1>별 잡기</h1><span class=\"tag\">30초 반응 챌린지</span></header>\n<section class=\"panel\" aria-label=\"별 잡기 게임\">\n<div class=\"stats\" aria-label=\"게임 기록\">\n<div class=\"stat\"><span>남은 시간</span><strong id=\"time\">30.0</strong></div>\n<div class=\"stat\"><span>점수</span><strong id=\"score\">0</strong></div>\n<div class=\"stat\"><span>놓침</span><strong id=\"misses\">0</strong></div>\n<div class=\"stat\"><span>최고 점수</span><strong id=\"best\">0</strong></div>\n</div>\n<div class=\"settings\"><label for=\"difficulty\">난이도</label><select id=\"difficulty\"><option value=\"easy\">쉬움 · 별 유지 1.8초</option><option value=\"normal\" selected>보통 · 별 유지 1.2초</option><option value=\"hard\">어려움 · 별 유지 0.8초</option></select></div>\n<div class=\"controls\"><button id=\"start\" type=\"button\">시작</button><button id=\"pause\" type=\"button\" disabled>일시정지</button><button id=\"restart\" type=\"button\" disabled>다시 시작</button></div>\n<div id=\"field\" aria-label=\"별이 나타나는 게임 영역\">\n<button id=\"target\" type=\"button\" aria-label=\"별 잡기, 누르면 1점\" hidden><svg viewBox=\"0 0 48 48\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M24 3 30 16 45 18 34 29 37 44 24 36 11 44 14 29 3 18 18 16Z\" fill=\"white\" stroke=\"black\" stroke-width=\"3\" stroke-linejoin=\"round\"/></svg></button>\n</div>\n<p id=\"status\" role=\"status\" aria-live=\"polite\" aria-atomic=\"true\">시작을 누르고 별을 잡으세요. 별 1개 = 1점!</p>\n</section>\n<details><summary>게임 방법 · 키보드 안내</summary><p>30초 동안 별 버튼을 클릭하거나 터치하세요. 별을 잡으면 1점, 제한 시간 안에 못 잡으면 놓침 1회입니다. 빈 배경 클릭은 놓침에 포함되지 않습니다.</p><p>시작하면 별에 초점이 갑니다. 키보드는 별에 초점을 둔 채 Space 또는 Enter를 한 번씩 누르세요. 키를 계속 누르기는 점수가 되지 않습니다. Tab으로 조작 버튼을 이동할 수 있습니다.</p><p>일시정지는 게임 시간과 현재 별의 남은 시간을 모두 보존합니다. 다른 탭으로 이동해도 자동 정지되며, 돌아온 뒤 ‘계속’을 누르세요. 진행 중 난이도 변경은 잠깁니다.</p><p>최고 점수는 난이도별로 이 브라우저에 저장됩니다. 파일 저장소가 차단되면 이번 실행 동안만 유지됩니다. 소리나 외부 연결은 없습니다.</p></details>\n</main>\n<script>\n'use strict';\n// 수업 포인트 1: 화면 요소를 한 번만 찾아 이름표처럼 보관합니다.\nconst byId = id => document.getElementById(id);\nconst ui = Object.fromEntries(['time','score','misses','best','difficulty','start','pause','restart','field','target','status'].map(id => [id, byId(id)]));\nconst ROUND_MS = 30000;\nconst lifetimes = {easy:1800, normal:1200, hard:800};\n// 다른 페이지와 기록이 섞이지 않도록 이 게임만의 저장 키를 씁니다.\nconst STORAGE_KEY = 'kr.byeoljapgi.standalone.v1.highscores';\nconst records = {easy:0, normal:0, hard:0};\ntry {\n  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');\n  for (const level of Object.keys(records)) {\n    if (Number.isSafeInteger(saved?.[level]) && saved[level] >= 0) records[level] = saved[level];\n  }\n} catch { /* 파일로 열 때 저장이 막혀도 게임은 계속 동작합니다. */ }\nlet state = 'ready';\nlet level = ui.difficulty.value;\nlet score = 0;\nlet misses = 0;\nlet remaining = ROUND_MS;\nlet targetRemaining = lifetimes[level];\nlet gameDeadline = 0;\nlet targetDeadline = 0;\nlet frame = 0;\nlet keyboardHeld = false;\n\nfunction announce(message) { ui.status.textContent = message; }\nfunction paint() {\n  ui.time.textContent = (Math.ceil(Math.max(0, remaining) / 100) / 10).toFixed(1);\n  ui.score.textContent = score;\n  ui.misses.textContent = misses;\n  ui.best.textContent = records[level];\n}\nfunction saveBest() {\n  if (score <= records[level]) return;\n  records[level] = score;\n  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); }\n  catch { /* 저장 실패 시에도 메모리에 최고 점수를 유지합니다. */ }\n}\nfunction controls() {\n  const active = state === 'running' || state === 'paused';\n  ui.start.disabled = active;\n  ui.pause.disabled = !active;\n  ui.pause.textContent = state === 'paused' ? '계속' : '일시정지';\n  ui.restart.disabled = state === 'ready';\n  ui.difficulty.disabled = active;\n  ui.target.hidden = state !== 'running';\n  ui.field.classList.toggle('playing', state === 'running');\n}\n// 수업 포인트 2: 별 크기와 그림자를 빼면 작은 화면에서도 밖으로 나가지 않습니다.\nfunction relocate() {\n  const maxX = Math.max(0, ui.field.clientWidth - 58 - 5);\n  const maxY = Math.max(0, ui.field.clientHeight - 58 - 5);\n  ui.target.style.left = Math.floor(Math.random() * maxX) + 'px';\n  ui.target.style.top = Math.floor(Math.random() * maxY) + 'px';\n}\nfunction finish() {\n  state = 'ended';\n  remaining = 0;\n  cancelAnimationFrame(frame);\n  saveBest();\n  paint();\n  controls();\n  announce('종료! 점수 ' + score + '점, 놓침 ' + misses + '회. 이 난이도 최고 ' + records[level] + '점입니다. 다시 도전해 보세요.');\n  // 별에 있던 초점이 사라지면 다시 시작 버튼으로 안전하게 이동합니다.\n  if (document.activeElement === ui.target || document.activeElement === document.body) ui.restart.focus({preventScroll:true});\n}\n// 수업 포인트 3: 프레임마다 시간을 빼지 않고 절대 마감 시각과 비교합니다.\n// 느린 컴퓨터에서도 30초가 길어지지 않으며, 누락된 별 시간도 계산합니다.\nfunction synchronize(now) {\n  if (state !== 'running') return false;\n  const cutoff = Math.min(now, gameDeadline);\n  if (targetDeadline < gameDeadline && targetDeadline <= cutoff) {\n    const elapsedTargets = Math.min(\n      Math.floor((cutoff - targetDeadline) / lifetimes[level]) + 1,\n      Math.ceil((gameDeadline - targetDeadline) / lifetimes[level])\n    );\n    misses += elapsedTargets;\n    targetDeadline += elapsedTargets * lifetimes[level];\n    relocate();\n  }\n  remaining = Math.max(0, gameDeadline - now);\n  if (now >= gameDeadline) { finish(); return false; }\n  targetRemaining = Math.max(0, targetDeadline - now);\n  paint();\n  return true;\n}\nfunction tick(now) {\n  if (synchronize(now)) frame = requestAnimationFrame(tick);\n}\nfunction begin() {\n  cancelAnimationFrame(frame);\n  level = ui.difficulty.value;\n  state = 'running';\n  score = 0;\n  misses = 0;\n  remaining = ROUND_MS;\n  targetRemaining = lifetimes[level];\n  const now = performance.now();\n  gameDeadline = now + remaining;\n  targetDeadline = now + targetRemaining;\n  controls();\n  relocate();\n  paint();\n  announce('시작! 별을 잡으세요. 시간 초과만 놓침으로 셉니다.');\n  ui.target.focus({preventScroll:true});\n  frame = requestAnimationFrame(tick);\n}\nfunction pauseGame(automatic = false) {\n  if (!synchronize(performance.now())) return;\n  // 반올림하지 않은 밀리초 값을 보관하므로 재개해도 시간이 깎이지 않습니다.\n  state = 'paused';\n  cancelAnimationFrame(frame);\n  const targetHadFocus = document.activeElement === ui.target;\n  controls();\n  announce(automatic ? '탭이 숨겨져 자동 정지했습니다. 계속을 누르면 이어집니다.' : '일시정지했습니다. 시간과 별의 남은 시간을 보존합니다.');\n  if (targetHadFocus) ui.pause.focus({preventScroll:true});\n}\nfunction resume() {\n  if (state !== 'paused' || document.hidden) return;\n  const now = performance.now();\n  gameDeadline = now + remaining;\n  targetDeadline = now + targetRemaining;\n  state = 'running';\n  controls();\n  announce('다시 시작합니다. 별을 잡으세요!');\n  ui.target.focus({preventScroll:true});\n  frame = requestAnimationFrame(tick);\n}\nui.start.addEventListener('click', begin);\nui.restart.addEventListener('click', begin);\nui.pause.addEventListener('click', () => state === 'running' ? pauseGame() : resume());\nui.difficulty.addEventListener('change', () => {\n  level = ui.difficulty.value;\n  paint();\n  announce('난이도를 바꿨습니다. 시작을 누르세요.');\n});\nui.target.addEventListener('click', event => {\n  // 키보드는 아래 keydown에서 직접 처리합니다. 합성 click은 중복 가산하지 않습니다.\n  // 보조 기술이 보내는 detail=0 클릭은 키를 누른 상태가 아닐 때 허용합니다.\n  if (event.detail === 0 && keyboardHeld) return;\n  hit();\n});\nfunction hit() {\n  if (state !== 'running') return;\n  const now = performance.now();\n  // 이미 시간이 지난 별을 눌렀다면 새로 나타난 별의 점수로 처리하지 않습니다.\n  const expired = now >= targetDeadline;\n  if (!synchronize(now) || expired) return;\n  score += 1;\n  saveBest();\n  targetDeadline = now + lifetimes[level];\n  targetRemaining = lifetimes[level];\n  relocate();\n  paint();\n}\n// 수업 포인트 4: 별에 초점이 있을 때만 키 입력을 받습니다. 전역 점수 단축키는 없습니다.\nui.target.addEventListener('keydown', event => {\n  if (event.key !== ' ' && event.key !== 'Enter') return;\n  event.preventDefault();\n  if (event.repeat || keyboardHeld) return;\n  keyboardHeld = true;\n  hit();\n});\ndocument.addEventListener('keyup', event => {\n  if (event.key === ' ' || event.key === 'Enter') {\n    // 기본 Space 클릭을 차단하고 한 번 누를 때 한 번만 가산합니다.\n    if (event.target === ui.target) event.preventDefault();\n    keyboardHeld = false;\n  }\n});\nwindow.addEventListener('blur', () => { keyboardHeld = false; });\ndocument.addEventListener('visibilitychange', () => {\n  keyboardHeld = false;\n  if (document.hidden && state === 'running') pauseGame(true);\n});\nwindow.addEventListener('resize', () => { if (state === 'running' || state === 'paused') relocate(); });\npaint();\ncontrols();\n<\/script>\n</body>\n</html>\n";

</script>

function approvalPage(){return '<div class="shell"><section class="panel student-entry"><h1>입장 정보가 저장되었습니다.</h1><p>강사가 추가 승인을 사용하고 있어요. 승인되면 자동으로 수업 화면이 열립니다. 다시 입력할 필요는 없습니다.</p><button class="btn ghost" data-action="enroll">학생 정보 변경</button><p class="muted">공개 슬라이드·소스의 복사를 막는 DRM은 아닙니다.</p></section></div>';}
async function updateStore(fn,redraw=true){if(!cloud)throw Error('온라인 연결을 사용할 수 없습니다.');const before=clone(state),next=clone(state);fn(next);await cloud.commit(before,next);state=cloud.snapshot();if(shouldFollow())localSlide=teacherSlide();if(redraw)render();}
function toast(text){const t=$('#toast');t.textContent=text;t.hidden=false;clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>t.hidden=true,3200);}
const timeText=t=>new Date(t).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
const byNew=a=>[...a].sort((a,b)=>b.created-a.created);
function setRoute(r){if(r==='slides'&&shouldFollow())localSlide=teacherSlide();if(location.hash==='#'+r){route=r;render();}else location.hash=r;}

 captureDrafts();const focusedDraft=document.activeElement?.id;const editedSlide=$('#slide-form')?.dataset.slideId;
 $('#remote-update-note')?.remove();
 if(shouldFollow())localSlide=teacherSlide();
 document.body.hidden=false; document.querySelectorAll('button[data-route=admin]').forEach(el=>el.hidden=!isTeacher());
 renderCloudStatus();
 document.body.dataset.route=route;
 document.title=`${state.course.title} · WEB GAME CLASS`;
 document.querySelectorAll('button[data-route],a[data-route]').forEach(b=>{b.classList.toggle('active',b.dataset.route===route);b.setAttribute('aria-current',b.dataset.route===route?'page':'false');});
 const root=$('#main');if(document.fullscreenElement?.id==='slide-stage'&&(isTeacher()||hasEntry())){$('#slide-stage').innerHTML=stageMarkup(state.slides[currentSlide()],currentSlide());}else root.innerHTML=!isTeacher()&&route!=='admin'&&!hasEntry()?studentEntryPage():waitingApproval()&&['slides','resources','participate'].includes(route)?approvalPage():({home:homePage,slides:slidesPage,participate:participatePage,resources:resourcesPage,admin:adminPage}[route]||homePage)();
 $('#print-root').innerHTML=state.policies.pdf&&(isTeacher()||(hasEntry()&&!waitingApproval()))?state.slides.map((s,i)=>`<section class="print-slide">${stageMarkup(s,i,true)}</section>`).join(''):'';
 if(editedSlide&&$('#edit-slide-select')){const i=state.slides.findIndex(s=>s.id===editedSlide);if(i>=0){$('#edit-slide-select').value=String(i);$('#slide-edit-form-slot').innerHTML=slideEditor(i);}}
 if(isTeacher()&&$('#current-participation-code'))$('#current-participation-code').value=cloud.teacherSettings()?.code||'';
 document.querySelectorAll('[data-module-start],[data-go-slide],[data-grid-slide]').forEach(el=>el.disabled=studentLocked());
 restoreDrafts();if(focusedDraft)document.getElementById(focusedDraft)?.focus({preventScroll:true});

function pageHeading(kicker,title,subtitle,actions=''){return `<div class="page-heading"><div><p class="eyebrow">${esc(kicker)}</p><h1>${esc(title)}</h1><p class="lead">${esc(subtitle)}</p></div>${actions}</div>`;}

function renderCloudStatus(){let bar=$('#cloud-status');if(!bar){bar=document.createElement('div');bar.id='cloud-status';bar.className='cloud-status';document.body.prepend(bar);}bar.innerHTML='<span role="status">'+(cloudStatus.connected?'서버 연결됨':'서버 연결 안 됨')+' · '+(isTeacher()?'강사 인증 완료':cloudStatus.entering?'입장 저장 중':hasEntry()?(waitingApproval()?'추가 승인 대기':'학생 입장 완료'):cloudStatus.ready?'참여코드·학번·이름 입력 대기':'학생 연결 준비 중')+'</span><div class="button-row">'+(!isTeacher()&&hasEntry()?'<button class="btn ghost small" data-action="enroll">학생 정보 변경</button><button class="btn ghost small" data-action="student-leave">학생 나가기</button>':'')+'<button class="btn ghost small" data-action="'+(isTeacher()?'teacher-logout':'teacher-login')+'">'+(isTeacher()?'강사 로그아웃':'강사 Google 로그인')+'</button></div>';}

function stageMarkup(s,index,print=false){const mod=moduleOf(s);let content='';
 if(s.kind==='cover'&&index===0){const landing=window.WEBGAME_LANDING_URL||'https://jeonggunhwa.github.io/webgame-classroom/';return `<article class="slide-page cover landing-cover" data-kind="cover"><div class="slide-kicker"><span>${esc(mod?.title||'강의')}</span><span>WEB GAME / 01</span></div><div class="slide-content cover-join-layout"><section><h2 class="slide-title">${esc(s.title)}</h2><p class="slide-subtitle">${esc(s.subtitle)}</p><div class="slide-grid">${(s.items||[]).map((it,i)=>slideBox(it,i)).join('')}</div></section><aside class="cover-join"><strong>QR로 바로 수업 입장</strong><img src="${esc(window.WEBGAME_QR_DATAURI||'')}" alt="웹게임교실 랜딩페이지 접속 QR 코드" width="360" height="360"><a href="${esc(landing)}" target="_blank" rel="noopener noreferrer">${esc(landing)}</a><p>학번 · 이름 · 4자리 참여코드 입력</p></aside></div><div class="slide-footer"><span>${esc(state.course.title)}</span><span>01 / ${state.slides.length}</span></div></article>`;}

 if(s.kind==='prompt')content=`<div class="prompt-code">${esc(s.prompt||'')}</div>${print?'':`<button class="btn dark small" data-copy-slide="${index}">${icon('copy')} 프롬프트 복사</button>`}`;
 else if(s.kind==='quiz'){const mine=state.answers[s.id]?.[personId];content=`<div class="quiz-options">${(s.options||[]).map((o,i)=>`<button class="quiz-option ${mine===i?'selected':''} ${mine!==undefined&&i===s.answer?'correct':''}" data-answer-slide="${index}" data-answer="${i}" ${print?'disabled':''}><span>${String.fromCharCode(65+i)}</span>${esc(o)}</button>`).join('')}</div>${mine!==undefined?`<p class="quiz-feedback">${mine===s.answer?'정답입니다.':'다시 생각해보세요.'} · ${esc(s.items?.find(it=>it.title==='정답 확인')?.body||s.items?.[0]?.body||'응답이 저장되었습니다.')}</p>`:'<p class="muted quiz-feedback">선택하면 본인 응답이 서버에 저장됩니다.</p>'}`;}
 else if(s.kind==='practice'||s.kind==='break')content=`<div class="slide-grid">${(s.items||[]).map((it,i)=>slideBox(it,i)).join('')}</div><div class="practice-timer"><span>${s.kind==='break'?'쉬는 시간':'실습 시간'}</span><strong class="timer-display" data-timer>${String(s.minutes||5).padStart(2,'0')}:00</strong>${print||!isTeacher()?'':`<button class="btn dark small" data-start-practice="${s.minutes||5}">타이머 시작</button>`}</div>`;

 return `<article class="slide-page ${s.kind==='cover'||s.kind==='ending'?'cover':''} ${s.kind==='prompt'?'prompt-page':''} ${s.kind==='quiz'?'quiz-page':''}" data-kind="${esc(s.kind)}"><div class="slide-kicker"><span>${esc(mod?.title||'강의')}</span><span>WEB GAME / ${String(index+1).padStart(2,'0')}</span></div><div class="slide-content"><h2 class="slide-title">${esc(s.title)}</h2><p class="slide-subtitle">${esc(s.subtitle)}</p>${content}</div><div class="slide-footer"><span>${esc(state.course.title)}</span><span>${String(index+1).padStart(2,'0')} / ${state.slides.length}</span></div></article>`;}

function participatePage(){const me=myEnrollment();return `<div class="shell">${pageHeading('PARTICIPATE','혼자 듣지 않는 수업.','질문하고, 결과를 나누고, 오늘의 배움을 남겨보세요.',`<button class="btn ghost" data-action="enroll">학생 정보 변경</button>`)}${localNotice()}<div class="tab-bar" role="tablist">${[['questions','질문 대기열'],['reviews','수강 후기'],['quiz','퀴즈 현황']].map(([k,v])=>`<button role="tab" aria-selected="${participationTab===k}" class="${participationTab===k?'active':''}" data-part-tab="${k}">${v}</button>`).join('')}</div>${participationTab==='questions'?questionsPanel():participationTab==='reviews'?reviewsPanel():quizPanel(false)}</div>`;}
function questionsPanel(){if(!isTeacher()&&state.policies.gate&&!myEnrollment()?.approved)return '<section class="panel"><p>질문을 보거나 작성하려면 수강 승인이 필요합니다.</p><button class="btn dark" data-action="enroll">학생 정보 확인</button></section>';return `<div class="portal-grid"><section class="panel"><p class="section-label">ASK A QUESTION</p><h2>질문을 남겨주세요.</h2><p class="muted">실명 없이 질문만 공유됩니다. 비밀번호·개인정보는 쓰지 마세요.</p>${state.policies.questions?`<form id="question-form" class="stack"><div class="field"><label for="question-text">궁금한 내용</label><textarea id="question-text" name="text" rows="5" maxlength="600" placeholder="어느 부분에서 막혔는지 구체적으로 적어주세요." required></textarea></div><button class="btn dark" type="submit">질문 등록 ${icon('arrow')}</button></form>`:'<div class="notice">지금은 질문 접수가 닫혀 있습니다.</div>'}</section><section class="panel"><div class="panel-title"><h2>함께 궁금한 질문</h2><span class="count">${state.questions.length}</span></div>${questionList(false)}</section></div>`;}
function questionList(admin){const q=[...state.questions].sort((a,b)=>Number(a.done)-Number(b.done)||b.voters.length-a.voters.length||a.created-b.created);return q.length?`<div class="stack">${q.map((x,i)=>`<article class="queue-item"><div class="list-content"><span class="badge ${x.done?'approved':'pending'}">${x.done?'답변 완료':'답변 대기'}</span><p>${esc(x.text)}</p><small class="muted">${timeText(x.created)} · 익명 질문</small></div><div class="list-actions">${admin?`<button class="btn ghost small" data-question-done="${esc(x.id)}">${x.done?'다시 대기':'답변 완료'}</button><button class="btn ghost small danger" data-question-delete="${esc(x.id)}">삭제</button>`:`<button class="btn ghost small" data-question-vote="${esc(x.id)}" ${x.voters.includes(personId)?'disabled':''}>공감 ${x.voters.length}</button>`}</div></article>`).join('')}</div>`:'<div class="empty"><p>첫 번째 질문을 기다리고 있어요.</p><small>궁금한 부분을 편하게 남겨주세요.</small></div>';}
function reviewsPanel(){if(!isTeacher()&&state.policies.gate&&!myEnrollment()?.approved)return '<section class="panel"><p>후기를 작성하려면 수강 승인이 필요합니다.</p><button class="btn dark" data-action="enroll">학생 정보 확인</button>'+publicReviews()+'</section>';const mine=state.reviews.find(r=>r.person===personId);return `<div class="portal-grid"><section class="panel"><p class="section-label">REFLECT & SHARE</p><h2>오늘 수업은 어땠나요?</h2><p class="muted">공개할 때 이름은 표시하지 않습니다. 승인된 후기를 수정하면 다시 비공개로 바뀝니다.</p>${state.policies.reviews?`<form id="review-form" class="stack"><div class="field"><label for="review-rating">만족도</label><select id="review-rating" name="rating">${[5,4,3,2,1].map(n=>`<option value="${n}" ${mine?.rating===n?'selected':''}>${n}점 · ${['','아쉬워요','조금 아쉬워요','보통이에요','좋았어요','아주 좋았어요'][n]}</option>`).join('')}</select></div><div class="field"><label for="review-text">후기 한 줄</label><textarea id="review-text" name="text" rows="4" maxlength="500" placeholder="오늘 가져가는 한 가지를 적어주세요." required>${esc(mine?.text||'')}</textarea></div><button class="btn dark" type="submit">${mine?'후기 수정':'후기 제출'} ${icon('arrow')}</button>${mine?`<small class="muted">내 후기 상태: ${mine.approved?'공개 승인됨':'승인 대기 · 비공개'}</small>`:''}</form>`:'<div class="notice">지금은 후기 접수가 닫혀 있습니다.</div>'}</section><section class="panel"><h2>수강생의 한마디</h2>${publicReviews()}</section></div>`;}
function quizPanel(admin){const quiz=state.slides.filter(s=>s.kind==='quiz');return `<div class="stack">${quiz.map(s=>{const answers=Object.values(state.answers[s.id]||{});const right=answers.filter(a=>a===s.answer).length;return `<section class="panel"><div class="panel-title"><h2>${esc(s.title)}</h2><span class="chip">${isTeacher()?'전체 응답 집계':'내 응답만 표시'}</span></div><p>${esc(s.subtitle)}</p><div class="stat-grid"><div class="stat-card"><strong>${answers.length}<small>명</small></strong><span>응답</span></div><div class="stat-card"><strong>${right}<small>명</small></strong><span>정답</span></div><div class="stat-card"><strong>${answers.length?Math.round(right/answers.length*100):0}<small>%</small></strong><span>정답률</span></div></div>${s.options.map((o,i)=>`<div class="quiz-result-row"><span>${String.fromCharCode(65+i)}. ${esc(o)}</span><div class="progress-track"><div class="progress-fill" style="width:${answers.length?answers.filter(a=>a===i).length/answers.length*100:0}%"></div></div><strong>${answers.filter(a=>a===i).length}</strong></div>`).join('')}<button class="btn ghost small" data-go-slide="${state.slides.indexOf(s)}">퀴즈 슬라이드 열기 ${icon('arrow')}</button></section>`;}).join('')||'<div class="empty">퀴즈 슬라이드가 없습니다.</div>'}<p class="muted">수강생에게는 본인 응답만, 강사에게는 전체 집계가 표시됩니다. 퀴즈 정답은 학습용 공개 콘텐츠입니다.</p></div>`;}
function resourcesPage(){const c=state.course;return `<div class="shell">${pageHeading('RESOURCE LIBRARY','필요한 자료를, 한곳에서.','같은 원본에서 꺼내 쓰는 실습 도구와 복사용 프롬프트')}<div class="notice">${icon('book')}<span>이 수업을 위해 새로 작성한 게임 제작 자료입니다. 이름·사진·계정 정보는 입력하지 마세요.</span></div>${state.policies.materials?`<div class="resource-grid">${c.resources.map((r,i)=>`<article class="resource-card"><span class="module-number">${String(i+1).padStart(2,'0')}</span><h2>${esc(r.title)}</h2><p>${esc(r.description)}</p><button class="btn ghost small" data-resource="${esc(r.type)}">${icon('download')} TXT 내려받기</button></article>`).join('')}</div><section class="panel"><div class="section-heading"><div><p class="section-label">COPY & START</p><h2>바로 쓰는 프롬프트</h2></div></div><div class="stack">${state.slides.map((s,i)=>s.kind==='prompt'?`<details class="prompt-details"><summary>${esc(s.title)}</summary><pre>${esc(s.prompt)}</pre><button class="btn dark small" data-copy-slide="${i}">${icon('copy')} 복사</button></details>`:'').join('')}</div></section>`:'<div class="panel empty"><h2>자료는 아직 공개 전이에요.</h2><p>강사가 자료를 공개하면 이곳에서 볼 수 있습니다.</p></div>'}<section class="panel glossary"><p class="section-label">SMALL DICTIONARY</p><h2>낯선 용어, 쉽게 이해하기.</h2><div class="curriculum-grid">${c.glossary.map(g=>`<article><h3>${esc(g.term)}</h3><p class="muted">${esc(g.definition)}</p></article>`).join('')}</div></section></div>`;}
function adminPage(){if(!isTeacher())return `<div class="shell"><section class="panel"><h1>강사 인증이 필요합니다.</h1><p>승인된 Google 계정으로 로그인한 강사만 수업을 운영할 수 있습니다.</p><button class="btn dark" data-action="teacher-login">Google로 강사 로그인</button></section></div>`;const tabs=[['control','진행 제어'],['participation','질문 · 퀴즈'],['approval','학생 명단 · 후기'],['edit','강의 편집'],['settings','저장 · 내보내기']];return `<div class="shell">${pageHeading('TEACHER WORKSPACE','수업 운영의 모든 순간.','진행 상태와 자료 공개, 참여 기록을 한눈에 관리하세요.',`<button class="btn dark" data-action="student-window">수강생 창 열기 ${icon('arrow')}</button>`)}${localNotice()}<div class="notice">${icon('lock')}<span><strong>인증된 강사 전용 운영 화면입니다.</strong> 서버 보안 규칙이 강사와 수강생의 접근 권한을 검증합니다.</span></div><div class="admin-layout"><aside class="admin-sidebar"><span class="section-label">WORKSPACE</span><nav class="admin-nav" aria-label="관리자 메뉴">${tabs.map(([k,v])=>`<button class="${adminTab===k?'active':''}" data-admin-tab="${k}">${v}${k==='approval'&&countPending()?`<span class="count">${countPending()}</span>`:''}</button>`).join('')}</nav><div class="admin-sidebar-bottom"><span class="status-dot"></span> Firebase 서버 연결</div></aside><div class="admin-main">${({control:adminControl,participation:()=>`<section class="admin-card"><h2>질문 대기열</h2>${questionList(true)}</section>${quizPanel(true)}`,approval:adminApproval,edit:adminEdit,settings:adminSettings}[adminTab])()}</div></div></div>`;}
function policy(key,title,desc){return `<label class="switch-row"><span><strong>${esc(title)}</strong><small>${esc(desc)}</small></span><input class="toggle" type="checkbox" data-policy="${key}" aria-label="${esc(title)}" ${state.policies[key]?'checked':''}></label>`;}
function participationCodeCard(){return '<section class="admin-card participation-code-card"><p class="section-label">PRIVATE ENTRY CODE</p><h2>참여코드</h2><p class="muted">숫자 4자리입니다. 변경하면 기존 학생도 새 코드로 다시 입장합니다. QR·주소·백업에는 포함되지 않습니다.</p><div class="field"><label for="current-participation-code">현재 참여코드</label><div class="button-row"><input id="current-participation-code" data-secret type="password" readonly autocomplete="off" aria-label="현재 참여코드"><button class="btn ghost small" type="button" data-action="reveal-code" aria-pressed="false">코드 보기</button></div></div><form id="participation-code-form" class="stack" autocomplete="off"><div class="field"><label for="new-participation-code">새 참여코드 · 숫자 4자리</label><input id="new-participation-code" name="participationCode" data-secret type="password" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" autocomplete="off" required></div><div class="button-row"><button class="btn dark" type="submit">새 코드 저장</button><button class="btn ghost small" type="button" data-action="generate-code">임의 코드 만들기</button></div></form></section>';}
function adminControl(){const s=state.slides[teacherSlide()];return `<div class="admin-grid"><section class="admin-card wide"><div class="admin-card-head"><div><p class="section-label">LIVE CONTROL</p><h2>현재 강의 진행</h2></div><span class="chip">${state.policies.locked?'강사 주도':'자유 열람'}</span></div><div class="admin-kpi"><strong>${String(teacherSlide()+1).padStart(2,'0')}</strong><span>/ ${state.slides.length}</span><div><small>${esc(moduleOf(s)?.title)}</small><h3 class="admin-slide-title">${esc(s.title)}</h3></div></div><div class="button-row"><button class="btn ghost" data-teacher-step="-1" ${teacherSlide()===0?'disabled':''}>← 이전</button><button class="btn dark" data-teacher-step="1" ${teacherSlide()===state.slides.length-1?'disabled':''}>다음 →</button><label class="slide-jump">바로 이동 <select id="teacher-jump" aria-label="강사 슬라이드 바로 이동">${state.slides.map((s,i)=>`<option value="${i}" ${teacherSlide()===i?'selected':''}>${i+1}. ${esc(s.title)}</option>`).join('')}</select></label></div><div class="policy-list">${policy('locked','강사 화면 따라가기 잠금','켜면 수강생 탭은 현재 장을 따라갑니다. 잠금 중에는 임의 이동과 따라가기 해제가 제한됩니다.')}</div></section>
<section class="admin-card"><div class="admin-card-head"><div><p class="section-label">VISIBILITY</p><h2>자료 공개 정책</h2></div>${icon('settings')}</div><div class="policy-list">${policy('pdf','PDF 저장 허용','강사 화면에도 같은 정책을 적용합니다.')}${policy('materials','자료실 공개','프롬프트·실습 자료 다운로드를 표시합니다.')}${policy('gate','입장 후 추가 승인 사용 (선택)','기본은 학번·이름 입력 후 바로 참여합니다. 켜면 강사의 추가 승인이 필요합니다. 공개 소스의 복사 방지 기능은 아닙니다.')}</div></section>
<section class="admin-card"><div class="admin-card-head"><div><p class="section-label">CLASS TIMER</p><h2>공용 실습 타이머</h2></div>${icon('clock')}</div><div class="timer-display" data-timer>05:00</div><div class="button-row"><select id="timer-minutes" aria-label="타이머 분"><option value="3">3분</option><option value="5" selected>5분</option><option value="10">10분</option><option value="15">15분</option></select><button class="btn dark small" data-action="timer-start">시작</button><button class="btn ghost small" data-action="timer-pause">일시정지</button><button class="btn ghost small" data-action="timer-reset">초기화</button></div><p class="muted">탭이 느려져도 실제 종료 시각을 기준으로 남은 시간을 계산합니다.</p></section>
${participationCodeCard()}<section class="admin-card"><p class="section-label">PARTICIPATION</p><h2>참여 도구</h2><div class="policy-list">${policy('questions','질문 접수','질문 등록을 열거나 닫습니다.')}${policy('reviews','후기 접수','후기는 제출 후 승인 대기로 저장합니다.')}</div></section><section class="admin-card"><p class="section-label">TODAY’S QUEUE</p><h2>확인이 필요한 항목</h2><div class="stat-grid"><div class="stat-card"><strong>${state.questions.filter(q=>!q.done).length}</strong><span>답변 대기</span></div><div class="stat-card"><strong>${countPending()}</strong><span>승인 대기</span></div></div><button class="btn ghost small" data-admin-tab="approval">학생 명단·후기 확인 ${icon('arrow')}</button></section></div>`;}
function adminApproval(){return `<div class="stack"><section class="admin-card"><div class="panel-title"><h2>학생 명단 · 후기</h2><span class="count">${state.enrollments.length}</span></div><p class="muted">학번·이름은 본인과 강사만 볼 수 있습니다. 추가 승인은 선택 사항이며 기본은 입력 후 바로 참여합니다. 나간 학생의 출석 기록은 삭제 전까지 남습니다.</p>${state.enrollments.length?byNew(state.enrollments).map(e=>`<div class="list-item"><div><strong>${esc(e.studentNo||'학번 재입력 필요')} · ${esc(e.name)}</strong><small class="muted"> · 입장 ${esc(new Date(e.created).toLocaleString('ko-KR'))}</small><span class="badge ${e.approved||!state.policies.gate?'approved':'pending'}">${e.approved?'추가 승인됨':state.policies.gate?'추가 승인 대기':'입장 완료'}</span></div><button class="btn ghost small" data-enroll-approve="${esc(e.id)}">${e.approved?'승인 취소':'추가 승인'}</button><button class="btn ghost small danger" data-enroll-delete="${esc(e.id)}">기록 삭제</button></div>`).join(''):'<div class="empty">아직 입장한 학생이 없습니다.</div>'}</section><section class="admin-card"><h2>후기 공개 승인</h2><p class="muted">기본 비공개 · 건별 승인 · 수정 시 자동 비공개 전환</p>${state.reviews.length?byNew(state.reviews).map(r=>`<article class="queue-item"><div class="list-content"><div class="stars">${'★'.repeat(r.rating)}</div><p>${esc(r.text)}</p><small class="muted">${timeText(r.created)} · 공개 시 이름 없음</small><span class="badge ${r.approved?'approved':'pending'}">${r.approved?'공개 중':'비공개'}</span></div><div class="list-actions"><button class="btn ${r.approved?'ghost':'dark'} small" data-review-approve="${esc(r.id)}">${r.approved?'비공개로':'공개 승인'}</button><button class="btn ghost small danger" data-review-delete="${esc(r.id)}">삭제</button></div></article>`).join(''):'<div class="empty">제출된 후기가 없습니다.</div>'}</section></div>`;}
function adminEdit(){const c=state.course;return `<div class="stack"><section class="admin-card"><p class="section-label">MAKE IT YOURS</p><h2>내 강의 정보</h2><form id="course-form" class="stack"><div class="form-grid">${[['title','강의명',c.title],['subtitle','한 줄 소개',c.subtitle],['instructor','강사명',c.instructor],['date','일정',c.date],['duration','총 강의 시간',c.duration],['audience','수강 대상',c.audience]].map(([k,label,v])=>`<div class="field"><label for="course-${k}">${label}</label><input id="course-${k}" name="${k}" value="${esc(v)}" maxlength="100" required></div>`).join('')}</div><div class="field"><label for="course-description">강의 설명</label><textarea id="course-description" name="description" rows="3" maxlength="500" required>${esc(c.description)}</textarea></div><button class="btn dark" type="submit">강의 정보 저장 ${icon('check')}</button></form></section><section class="admin-card"><div class="admin-card-head"><div><p class="section-label">SLIDE EDITOR</p><h2>슬라이드 내용 바꾸기</h2></div><button class="btn ghost small" data-action="add-slide">새 슬라이드</button></div><div class="field"><label for="edit-slide-select">편집할 슬라이드</label><select id="edit-slide-select">${state.slides.map((s,i)=>`<option value="${i}">${i+1}. ${esc(s.title)}</option>`).join('')}</select></div><div id="slide-edit-form-slot">${slideEditor(0)}</div></section><section class="admin-card"><h2>전체 구조 편집</h2><p class="muted">모듈·자료실·용어집과 슬라이드 유형은 설정에서 강의 JSON을 내려받아 수정한 뒤 가져올 수 있습니다. 가져오기 전에 현재 강의를 백업하세요.</p><button class="btn ghost" data-admin-tab="settings">저장·내보내기 ${icon('arrow')}</button></section></div>`;}
function slideEditor(i){const s=state.slides[i];return `<form id="slide-form" class="stack" data-index="${i}" data-slide-id="${esc(s.id)}"><div class="form-grid"><div class="field"><label for="slide-title">제목</label><input id="slide-title" name="title" value="${esc(s.title)}" maxlength="60" required></div><div class="field"><label for="slide-module">모듈</label><select id="slide-module" name="module">${state.course.modules.map(m=>`<option value="${esc(m.id)}" ${s.module===m.id?'selected':''}>${esc(m.title)}</option>`).join('')}</select></div></div><div class="field"><label for="slide-subtitle">설명</label><input id="slide-subtitle" name="subtitle" value="${esc(s.subtitle)}" maxlength="130"></div><div class="field"><label for="slide-items">카드 내용 · 한 줄에 제목 | 설명 (최대 4줄)</label><textarea id="slide-items" name="items" rows="5">${esc((s.items||[]).map(it=>it.title+' | '+it.body).join('\n'))}</textarea></div>${s.kind==='prompt'?`<div class="field"><label for="slide-prompt">복사할 프롬프트</label><textarea id="slide-prompt" name="prompt" rows="5" maxlength="1200">${esc(s.prompt)}</textarea></div>`:''}${s.kind==='quiz'?`<div class="field"><label for="slide-options">보기 · 한 줄에 하나 (2~4개)</label><textarea id="slide-options" name="options" rows="4">${esc(s.options.join('\n'))}</textarea></div><div class="field"><label for="slide-answer">정답 번호 (1부터)</label><input id="slide-answer" name="answer" type="number" min="1" max="4" value="${s.answer+1}" required></div>`:''}${['practice','break'].includes(s.kind)?`<div class="field"><label for="slide-minutes">실습 시간 (분)</label><input id="slide-minutes" name="minutes" type="number" min="1" max="60" value="${s.minutes||5}" required></div>`:''}<div class="button-row"><button class="btn dark" type="submit">이 슬라이드 저장</button><button class="btn ghost small" type="button" data-go-slide="${i}">미리보기</button><button class="btn ghost small danger" type="button" data-delete-slide="${i}" ${state.slides.length<2?'disabled':''}>삭제</button></div></form>`;}
function adminSettings(){return `<div class="stack"><section class="admin-card"><p class="section-label">YOUR CONTENT, YOUR FILE</p><h2>저장과 이동</h2><p>강의 내용과 운영 기록은 Firebase 서버에 저장됩니다. 중요한 데이터는 별도로 백업하세요.</p><div class="settings-grid"><div class="panel"><h3>강의 콘텐츠 내보내기</h3><p class="muted">강의 정보와 슬라이드만 포함합니다. 이름·신청·질문·후기는 포함하지 않습니다.</p><button class="btn dark" data-action="export-course">${icon('download')} 강의 JSON</button></div><div class="panel"><h3>강의 콘텐츠 가져오기</h3><p class="muted">강의 JSON 또는 전체 백업을 가져옵니다. 현재 내용은 교체 전 자동 백업합니다.</p><label class="btn ghost" for="import-file">JSON 파일 선택</label><input id="import-file" type="file" accept="application/json,.json" hidden></div></div><div class="button-row"><button class="btn ghost" data-action="export-records">운영 기록 백업</button><button class="btn ghost danger" data-action="reset-records">참여 기록 초기화</button><button class="btn ghost danger" data-action="reset-all">샘플 강의로 초기화</button></div></section><section class="admin-card"><p class="section-label">BEFORE YOU GO LIVE</p><h2>실제 수업 공개 전 확인</h2><ul class="safe-list"><li>강사는 승인된 Google 계정, 수강생은 익명 인증으로 연결됩니다. 불필요한 개인정보를 입력하지 마세요.</li><li>동기화·질문·퀴즈·후기·신청은 같은 온라인 강의실에 실시간 연결됩니다.</li><li>수강생은 본인의 신청·비공개 후기·답안만 읽고 쓸 수 있습니다.</li><li>PDF·자료실 스위치와 수강 승인 게이트는 화면 정책입니다. 공개 파일 복사나 소스 열람을 막는 DRM이 아닙니다.</li><li>이메일·문자 알림은 연결하지 않았으며 비용이 발생하지 않습니다.</li><li>서비스 계정 키·비밀번호·명단을 공개 폴더에 넣지 마세요.</li></ul></section></div>`;}
async function setTeacherSlide(n,lock=true){await cloud.setTeacherSlide(Math.min(state.slides.length-1,Math.max(0,n)),lock);state=cloud.snapshot();localSlide=teacherSlide();render();}
function navigateSlide(value,relative=false,jump=false){slideNavigation=slideNavigation.catch(()=>{}).then(async()=>{if(studentLocked()){toast('강사가 현재 슬라이드를 진행하고 있습니다.');return;}const n=Math.min(state.slides.length-1,Math.max(0,relative?currentSlide()+value:value));if(isTeacher()&&teacherPresenting)await setTeacherSlide(n);else{follow=false;localSlide=n;render();}if(jump)setRoute('slides');});return slideNavigation;}
function moveSlide(delta){return navigateSlide(delta,true);}
function goSlide(i){return navigateSlide(i,false,true);}
function showModal(title,body,footer=''){modalLastFocus=document.activeElement;$('#modal-root').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title">${esc(title)}</h2><button class="btn ghost small" data-action="close-modal" aria-label="닫기">${icon('close')}</button></div><div class="modal-body">${body}</div>${footer?`<div class="modal-footer">${footer}</div>`:''}</section></div>`;$('#modal-root').querySelector('button,input,select,textarea')?.focus();}
function closeModal(){const old=modalLastFocus;$('#modal-root').innerHTML='';if(old?.isConnected)old.focus();}
async function gridModal(){if(document.fullscreenElement){try{await document.exitFullscreen();}catch{toast('전체화면을 종료한 뒤 목차를 열어주세요.');return;}}showModal('전체 슬라이드 · '+state.slides.length+'장',`<div class="grid-thumbs">${state.slides.map((s,i)=>`<button class="thumb-btn ${currentSlide()===i?'active':''}" data-grid-slide="${i}" ${studentLocked()?'disabled':''}><div class="thumb-preview" aria-hidden="true">${stageMarkup(s,i,true).replace(/<button\b[^>]*>/g,'<span>').replace(/<\/button>/g,'</span>')}</div><span class="thumb-number">${String(i+1).padStart(2,'0')} · ${esc(moduleOf(s)?.title)}</span><span class="thumb-title">${esc(s.title)}</span></button>`).join('')}</div>`);$('#modal-root .modal').classList.add('grid-modal');}
function enrollmentModal(){if(isTeacher())return;showModal('학생 정보 변경',entryForm(true)+'<p class="muted">정보를 변경하면 추가 승인은 초기화됩니다. 다른 학생이 사용할 때는 학생 나가기를 눌러주세요.</p>');}
function confirmAction(title,text,action){showModal(title,`<p>${esc(text)}</p>`,`<button class="btn ghost" data-action="close-modal">취소</button><button class="btn danger" data-confirm="${action}">확인하고 진행</button>`);}
async function copyText(text){try{if(!navigator.clipboard?.writeText)throw Error();await Promise.race([navigator.clipboard.writeText(text),new Promise((_,r)=>setTimeout(()=>r(Error()),700))]);toast('프롬프트를 복사했습니다.');}catch(e){showModal('텍스트 복사',`<p class="muted">아래 내용을 선택해 복사하세요.</p><textarea id="copy-fallback" rows="8" readonly>${esc(text)}</textarea>`);const a=$('#copy-fallback');a.focus();a.select();try{if(document.execCommand('copy')){closeModal();toast('프롬프트를 복사했습니다.');}}catch(e){}}}
function download(name,text,type='text/plain;charset=utf-8'){const blob=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function exportCourse(){const normalized=cloud.normalizeContent(state);download('my-course.json',JSON.stringify({format:'classroom-course',version:1,course:normalized.course,slides:normalized.slides},null,2),'application/json');}
function resourceText(type){if(type==='prompts')return state.slides.filter(s=>s.kind==='prompt').map(s=>s.title+'\n\n'+s.prompt).join('\n\n----------\n\n');if(type==='notes')return state.course.title+'\n수업 진행 · 총 155분\n\n1차시 00:00~00:45 첫 게임 제작\n휴식 00:45~00:55\n2차시 00:55~01:40 규칙과 재미\n휴식 01:40~01:50\n3차시 01:50~02:35 나만의 게임 완성\n\n내 게임 제목: \n게임 규칙: \n개선한 점: \n테스트 결과: \n남은 질문: \n\nAI는 선생님이 허용한 계정과 도구로 사용하고 개인정보를 입력하지 않습니다. 계정 생성·로그인·AI API 자동 연결은 제공하지 않습니다.\n';return state.course.title+'\n게임 완성 체크리스트\n\n[ ] game.html을 UTF-8로 저장, 확장자 .txt 아님\n[ ] 시작 전 점수 0점 · 남은 시간 30초\n[ ] 별 클릭마다 1점 증가\n[ ] 종료 후 추가 득점 불가\n[ ] 다시 시작하면 점수·시간 초기화\n[ ] 일시정지 후 재개하면 남은 시간 유지\n[ ] 모바일에서 별이 화면 밖으로 나가지 않음\n[ ] 키보드 Tab과 Enter로 조작 가능\n[ ] 실명·학교명·사진·계정·비밀키 미포함\n[ ] 오류를 재현하고 변경은 한 번에 하나씩 요청\n[ ] 공유 전 선생님 확인\n\n현재 강의실은 Firebase 온라인 버전입니다. 인터넷 연결과 인증이 필요합니다.\n';}
async function startTimer(minutes){await updateStore(s=>{const seconds=Math.max(1,Number(minutes)||5)*60;s.live.timerEnd=Date.now()+seconds*1000;s.live.timerPaused=seconds;});}
function tickTimers(){const seconds=state.live.timerEnd?Math.max(0,Math.ceil((state.live.timerEnd-Date.now())/1000)):state.live.timerPaused||0;const text=seconds?`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`:state.live.timerEnd?'00:00':route==='slides'&&state.slides[currentSlide()]&&['practice','break'].includes(state.slides[currentSlide()]?.kind)?String(state.slides[currentSlide()].minutes||5).padStart(2,'0')+':00':'05:00';document.querySelectorAll('#main [data-timer]').forEach(el=>{el.textContent=text;el.classList.toggle('timer-ended',!!state.live.timerEnd&&seconds===0);});}
function printSlides(){if(!isTeacher()&&(!hasEntry()||waitingApproval())){toast('입장과 추가 승인 상태를 확인해주세요.');return;}if(!state.policies.pdf){toast('현재 PDF 저장이 허용되지 않습니다.');return;}$('#print-root').innerHTML=state.slides.map((s,i)=>`<section class="print-slide">${stageMarkup(s,i,true)}</section>`).join('');window.print();}
function validateCourse(x){const fail=m=>{throw Error(m);};if(x?.format!=='classroom-course'||x.version!==1)fail('지원하는 강의 JSON 형식이 아닙니다.');const c=x.course;if(!c||!Array.isArray(c.modules)||c.modules.length<1||c.modules.length>12)fail('학습 모듈을 1~12개 넣어주세요.');['title','subtitle','instructor','date','duration','audience','description'].forEach(k=>{if(typeof c[k]!=='string'||c[k].length>2000)fail('강의 정보 항목을 확인해주세요: '+k);});const ids=c.modules.map(m=>m.id);if(new Set(ids).size!==ids.length||ids.some(id=>typeof id!=='string'||!/^[A-Za-z0-9_-]{1,80}$/.test(id)||['__proto__','constructor','prototype'].includes(id)))fail('모듈 ID가 올바르지 않습니다.');c.modules.forEach(m=>{if(typeof m.title!=='string'||typeof m.summary!=='string'||!Number.isFinite(m.minutes)||m.minutes<0)fail('모듈 내용을 확인해주세요.');});if(!Array.isArray(c.resources)||!c.resources.every(r=>typeof r.title==='string'&&typeof r.description==='string'&&['checklist','notes','prompts'].includes(r.type)))fail('자료실 형식이 잘못되었습니다.');if(!Array.isArray(c.glossary)||!c.glossary.every(g=>typeof g.term==='string'&&typeof g.definition==='string'))fail('용어집 형식을 확인해주세요.');if(!Array.isArray(x.slides)||!x.slides.length||x.slides.length>150)fail('슬라이드는 1~150장이어야 합니다.');const slideIds=new Set();x.slides.forEach((s,i)=>{if(!s.id||typeof s.id!=='string'||!/^[A-Za-z0-9_-]{1,80}$/.test(s.id)||['__proto__','constructor','prototype'].includes(s.id)||slideIds.has(s.id))fail('슬라이드 ID가 없거나 중복되었습니다.');slideIds.add(s.id);if(!ids.includes(s.module)||!['cover','cards','steps','compare','prompt','quiz','practice','break','ending'].includes(s.kind)||typeof s.title!=='string'||typeof s.subtitle!=='string')fail(`${i+1}번 슬라이드 기본 정보가 올바르지 않습니다.`);if(!Array.isArray(s.items)||s.items.length>4||s.items.some(it=>typeof it.title!=='string'||typeof it.body!=='string'))fail(`${i+1}번 슬라이드 카드 형식이 올바르지 않습니다.`);if(s.kind==='quiz'&&(!Array.isArray(s.options)||s.options.length<2||s.options.length>4||!s.options.every(o=>typeof o==='string')||!Number.isInteger(s.answer)||s.answer<0||s.answer>=s.options.length))fail('퀴즈 보기·정답을 확인해주세요.');if(s.kind==='prompt'&&typeof s.prompt!=='string')fail('프롬프트 내용을 확인해주세요.');});return true;}
function backupState(x){if(x?.format!=='classroom-backup'||x.version!==1||!x.state)throw Error('전체 백업 형식이 올바르지 않습니다.');const next=cloud.normalizeContent(x.state);validateCourse({format:'classroom-course',version:1,course:next.course,slides:next.slides});cloud.validateRestore(next);return next;}
async function importCourse(file){if(!file)return;try{if(file.size>2e6)throw Error('2MB 이하의 파일을 선택해주세요.');let x=JSON.parse(await file.text());const isBackup=x.format==='classroom-backup';let replacement;if(isBackup)replacement=backupState(x);else{x=cloud.normalizeContent(x);validateCourse(x);replacement={...defaults(),course:clone(x.course),slides:clone(x.slides)};}cloud.validateRestore(replacement);showModal(isBackup?'전체 백업을 복원할까요?':'새 강의로 교체할까요?',`<p><strong>${esc(replacement.course.title)}</strong> · ${replacement.slides.length}장</p><p>${isBackup?'강의 콘텐츠와 운영 기록을 함께 복원합니다.':'새 강의를 가져오면 기존 참여 기록은 초기화됩니다.'} 현재 상태는 먼저 전체 백업 파일로 내려받습니다.</p>`,`<button class="btn ghost" data-action="close-modal">취소</button><button class="btn dark" id="confirm-import">백업 후 ${isBackup?'복원':'가져오기'}</button>`);$('#confirm-import').onclick=safe(async()=>{download('classroom-backup-before-import.json',JSON.stringify({format:'classroom-backup',version:1,state},null,2),'application/json');await cloud.restore(replacement);state=cloud.snapshot();dirtyFields.clear();localSlide=0;closeModal();render();toast(isBackup?'전체 백업을 복원했습니다.':'새 강의 콘텐츠를 가져왔습니다.');});}catch(e){toast('가져오기 실패: '+e.message);}}

// Delegated events keep re-rendered views interactive without duplicate handlers.
document.addEventListener('click',safe(async e=>{const b=e.target.closest('button,a[data-route],label[data-action]');if(!b)return;const d=b.dataset;
 if(d.action==='teacher-login'){await cloud.login();return;}if(d.action==='teacher-logout'){closeModal();dirtyFields.clear();await cloud.logout();setRoute('home');return;}if(d.action==='student-leave'){closeModal();dirtyFields.clear();entryIntent='slides';await cloud.leaveStudent();setRoute('home');return;}
 const teacherAction=d.adminTab||d.teacherStep||d.questionDone||d.questionDelete||d.reviewApprove||d.reviewDelete||d.enrollApprove||d.enrollDelete||d.deleteSlide!==undefined||d.confirm||d.startPractice||['student-window','export-course','export-records','reset-records','reset-all','timer-start','timer-pause','timer-reset','add-slide'].includes(d.action);if(teacherAction&&!isTeacher()){toast('강사 인증이 필요합니다.');return;}
 if(d.route){e.preventDefault();setRoute(d.route);return;}
 if(d.adminTab){adminTab=d.adminTab;render();return;}
 if(d.partTab){participationTab=d.partTab;render();return;}
 if(d.moduleStart){const i=state.slides.findIndex(s=>s.module===d.moduleStart);await goSlide(Math.max(0,i));return;}
 if(d.goSlide!==undefined){await goSlide(Number(d.goSlide));return;}
 if(d.gridSlide!==undefined){closeModal();await goSlide(Number(d.gridSlide));return;}
 if(d.copySlide!==undefined){copyText(state.slides[Number(d.copySlide)].prompt||'');return;}
 if(d.answerSlide!==undefined){const s=state.slides[Number(d.answerSlide)];await updateStore(x=>{x.answers[s.id]??={};x.answers[s.id][personId]=Number(d.answer);});toast('본인 응답이 서버에 저장되었습니다.');return;}
 if(d.startPractice){await startTimer(Number(d.startPractice));return;}
 if(d.teacherStep){await setTeacherSlide(teacherSlide()+Number(d.teacherStep));return;}
 if(d.questionVote){await updateStore(s=>{const q=s.questions.find(q=>q.id===d.questionVote);if(q&&!q.voters.includes(personId))q.voters.push(personId);});return;}
 if(d.questionDone){await updateStore(s=>{const q=s.questions.find(q=>q.id===d.questionDone);if(q)q.done=!q.done;});return;}
 if(d.questionDelete){await updateStore(s=>s.questions=s.questions.filter(q=>q.id!==d.questionDelete));return;}
 if(d.reviewApprove){await updateStore(s=>{const r=s.reviews.find(r=>r.id===d.reviewApprove);if(r)r.approved=!r.approved;});return;}
 if(d.reviewDelete){await updateStore(s=>s.reviews=s.reviews.filter(r=>r.id!==d.reviewDelete));return;}
 if(d.enrollDelete){await updateStore(s=>{s.enrollments=s.enrollments.filter(a=>a.id!==d.enrollDelete);});return;}if(d.enrollApprove){await updateStore(s=>{const a=s.enrollments.find(a=>a.id===d.enrollApprove);if(a)a.approved=!a.approved;});return;}
 if(d.resource){if(!state.policies.materials){toast('자료가 비공개 상태입니다.');return;}download(`classroom-${d.resource}.txt`,resourceText(d.resource));return;}
 if(d.deleteSlide!==undefined){confirmAction('슬라이드 삭제','이 장을 삭제하면 퀴즈 응답도 함께 삭제됩니다.','delete-slide-'+d.deleteSlide);return;}
 if(d.confirm){const action=d.confirm;closeModal();if(action==='reset-all'){await cloud.reset(true);state=cloud.snapshot();localSlide=0;}else if(action==='reset-records'){await cloud.reset(false);state=cloud.snapshot();}else if(action==='export-records'){download('classroom-records.json',JSON.stringify({format:'classroom-backup',version:1,exported:new Date().toISOString(),state},null,2),'application/json');}else if(action.startsWith('delete-slide-')){const i=Number(action.replace('delete-slide-',''));await updateStore(s=>{if(s.slides.length<2)return;delete s.answers[s.slides[i].id];s.slides.splice(i,1);s.live.slide=Math.min(s.live.slide,s.slides.length-1);});localSlide=Math.min(localSlide,state.slides.length-1);}render();toast('변경 내용을 저장했습니다.');return;}
 switch(d.action){case'teacher-presenting':if(!isTeacher())return;{const next=!teacherPresenting;await updateStore(s=>{s.policies.locked=next;if(next)s.live.slide=currentSlide();},false);teacherPresenting=next;render();toast(next?'실시간 진행을 켰습니다. 학생 화면이 함께 이동합니다.':'비공개 미리보기입니다. 학생 잠금을 해제했습니다.');}break;case'reveal-code':if(!isTeacher())return;{const input=$('#current-participation-code');if(input){const reveal=input.type==='password';input.type=reveal?'text':'password';e.target.textContent=reveal?'코드 숨기기':'코드 보기';e.target.setAttribute('aria-pressed',String(reveal));}}break;case'generate-code':if(!isTeacher())return;$('#new-participation-code').value=cloud.randomParticipationCode();toast('임의 코드를 만들었습니다. 새 코드 저장을 눌러 적용하세요.');break;case'play-game':playGame();break;case'download-game':download('별잡기.html',window.WEBGAME_DEMO_HTML,'text/html;charset=utf-8');break;case'prev':await moveSlide(-1);break;case'next':await moveSlide(1);break;case'grid':await gridModal();break;case'print':printSlides();break;case'fullscreen':{const el=$('#slide-stage');if(el?.requestFullscreen)el.requestFullscreen().catch(()=>toast('이 브라우저에서는 전체화면을 사용할 수 없습니다.'));else toast('이 브라우저에서는 전체화면을 지원하지 않습니다.');break;}case'close-modal':closeModal();break;case'enroll':enrollmentModal();break;case'student-window':window.open(location.href.split('#')[0]+'#slides','_blank','noopener');break;case'export-course':exportCourse();break;case'export-records':confirmAction('운영 기록 내보내기','학번·이름과 질문·후기가 포함됩니다. 파일을 공개 저장소에 올리지 마세요.','export-records');break;case'reset-records':confirmAction('참여 기록 초기화','신청·질문·후기·퀴즈 응답과 진행 상태가 삭제됩니다. 먼저 운영 기록을 백업하세요.','reset-records');break;case'reset-all':confirmAction('샘플 강의로 초기화','편집한 강의와 모든 운영 기록이 삭제됩니다. 먼저 콘텐츠와 운영 기록을 백업하세요.','reset-all');break;case'timer-start':await startTimer(Number($('#timer-minutes')?.value||5));break;case'timer-pause':await updateStore(s=>{s.live.timerPaused=s.live.timerEnd?Math.max(0,Math.ceil((s.live.timerEnd-Date.now())/1000)):s.live.timerPaused;s.live.timerEnd=0;});break;case'timer-reset':await updateStore(s=>{s.live.timerEnd=0;s.live.timerPaused=0;});break;case'add-slide':await updateStore(s=>s.slides.push({id:uid(),module:s.course.modules[0].id,kind:'cards',title:'새 슬라이드',subtitle:'여기에 핵심 내용을 적어주세요.',items:[{title:'핵심 하나',body:'한 장에는 하나의 메시지만 담습니다.'}]}));$('#edit-slide-select').value=String(state.slides.length-1);$('#slide-edit-form-slot').innerHTML=slideEditor(state.slides.length-1);break;}
}));
document.addEventListener('change',safe(async e=>{const el=e.target;if((el.dataset.policy||['teacher-jump','edit-slide-select','import-file'].includes(el.id))&&!isTeacher())return;if(el.dataset.policy){await updateStore(s=>{s.policies[el.dataset.policy]=el.checked;});return;}if(el.id==='follow-toggle'){follow=el.checked;if(shouldFollow())localSlide=teacherSlide();render();return;}if(el.id==='teacher-jump'){await setTeacherSlide(Number(el.value));return;}if(el.id==='edit-slide-select'){$('#slide-edit-form-slot').innerHTML=slideEditor(Number(el.value));return;}if(el.id==='import-file')await importCourse(el.files[0]);}));
document.addEventListener('submit',safe(async e=>{const f=e.target;e.preventDefault();const fd=new FormData(f);const submittedDrafts=new Map([...dirtyFields].filter(([key])=>key.startsWith(f.id+':')).map(([key,v])=>[key,v.revision]));if(['course-form','slide-form','participation-code-form'].includes(f.id)&&!isTeacher())return;
 if(f.id==='question-form'){const text=String(fd.get('text')).trim();if(!text)return;if(!state.policies.questions){toast('질문 접수가 닫혀 있습니다.');return;}await updateStore(s=>s.questions.push({id:uid(),person:personId,text,created:Date.now(),done:false,voters:[]}));toast('질문을 등록했습니다.');}
 else if(f.id==='review-form'){const text=String(fd.get('text')).trim();if(!text)return;if(!state.policies.reviews){toast('후기 접수가 닫혀 있습니다.');return;}const rating=Math.max(1,Math.min(5,Number(fd.get('rating'))||5));await updateStore(s=>{const old=s.reviews.find(r=>r.person===personId);if(old){Object.assign(old,{text,rating,approved:false,created:Date.now()});}else s.reviews.push({id:uid(),person:personId,text,rating,approved:false,created:Date.now()});});toast('후기를 저장했습니다. 승인 전에는 비공개입니다.');}
 else if(f.id==='participation-code-form'){let code=String(fd.get('participationCode')||'');fd.delete('participationCode');f.querySelector('[data-secret]').value='';try{await cloud.setParticipationCode(code);toast('참여코드를 변경했습니다. 학생은 새 코드로 다시 입장해주세요.');}finally{code='';}}
 else if(f.id==='enroll-form'){let code=String(fd.get('participationCode')||'');fd.delete('participationCode');f.querySelector('[data-secret]').value='';const studentNo=String(fd.get('studentNo')||'').trim(),name=String(fd.get('name')||'').trim();if(!/^[0-9]{2,12}$/.test(studentNo)||!name||name.length>40)throw Error('학번은 숫자 2~12자리, 이름은 1~40자로 입력해주세요.');try{await cloud.enterStudent(studentNo,name,code);}finally{code='';} state=cloud.snapshot();closeModal();for(const key of [...dirtyFields.keys()])if(key.startsWith('enroll-form:'))dirtyFields.delete(key);setRoute(entryIntent||'slides');toast(state.policies.gate&&!myEnrollment()?.approved?'입장 정보를 저장했습니다. 추가 승인을 기다려주세요.':'입장했습니다. 수업을 시작하세요.');}
 else if(f.id==='course-form'){await updateStore(s=>{['title','subtitle','instructor','date','duration','audience','description'].forEach(k=>s.course[k]=String(fd.get(k)).trim());});toast('강의 정보를 저장했습니다.');}
 else if(f.id==='slide-form'){const i=Number(f.dataset.index);const items=String(fd.get('items')).split('\n').filter(x=>x.trim()).map(line=>{const [title,...rest]=line.split('|');return{title:title.trim(),body:rest.join('|').trim()};});if(items.length>4){toast('카드는 최대 4개입니다.');return;}if(state.slides[i].kind==='quiz'){const options=String(fd.get('options')).split('\n').map(x=>x.trim()).filter(Boolean);const answer=Number(fd.get('answer'))-1;if(options.length<2||options.length>4||answer<0||answer>=options.length){toast('보기 2~4개와 올바른 정답 번호를 입력하세요.');return;}}
 await updateStore(s=>{const slide=s.slides[i];Object.assign(slide,{title:String(fd.get('title')).trim(),subtitle:String(fd.get('subtitle')).trim(),module:String(fd.get('module')),items});if(slide.kind==='prompt')slide.prompt=String(fd.get('prompt'));if(['practice','break'].includes(slide.kind))slide.minutes=Number(fd.get('minutes'));if(slide.kind==='quiz'){slide.options=String(fd.get('options')).split('\n').map(x=>x.trim()).filter(Boolean);slide.answer=Number(fd.get('answer'))-1;delete s.answers[slide.id];}});$('#edit-slide-select').value=String(i);$('#slide-edit-form-slot').innerHTML=slideEditor(i);toast('슬라이드와 관리자 목록을 함께 갱신했습니다.');}
for(const [key,revision]of submittedDrafts)if(dirtyFields.get(key)?.revision===revision)dirtyFields.delete(key);render();
}));
window.addEventListener('hashchange',()=>{const r=location.hash.replace('#','').split('/')[0];route=['home','slides','participate','resources','admin'].includes(r)?r:'home';render();window.scrollTo({top:0});});
function receiveRemote(next){captureDrafts();state=next;if(shouldFollow())localSlide=teacherSlide();render();}
if(cloud){cloud.on('state',receiveRemote);cloud.on('status',s=>{const identityChanged=cloudStatus.teacher!==s.teacher||personId!==(s.uid||'');const changed=identityChanged||cloudStatus.entered!==s.entered||cloudStatus.ready!==s.ready||cloudStatus.connected!==s.connected||cloudStatus.entering!==s.entering;cloudStatus=s;personId=s.uid||'';if(identityChanged){teacherPresenting=true;dirtyFields.clear();closeModal();}renderCloudStatus();if(changed)render();});cloud.on('teacherSettings',()=>{if(isTeacher()&&$('#current-participation-code')){$('#current-participation-code').type='password';$('#current-participation-code').value=cloud.teacherSettings()?.code||'';const b=$('[data-action="reveal-code"]');if(b){b.textContent='코드 보기';b.setAttribute('aria-pressed','false');}}});cloud.on('error',text=>toast(text));}
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)render();});
document.addEventListener('keydown',safe(async e=>{const modal=$('#modal-root .modal');if(modal){if(e.key==='Escape'){closeModal();return;}if(e.key==='Tab'){const f=[...modal.querySelectorAll('button:not([disabled]),input,select,textarea,a[href]')].filter(x=>!x.hidden);if(f.length){const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}}return;}if(e.target.matches('input,textarea,select')||e.ctrlKey||e.metaKey||e.altKey)return;if(route==='slides'&&(isTeacher()||(hasEntry()&&!waitingApproval()))){if(e.key==='ArrowRight'){e.preventDefault();await moveSlide(1);}if(e.key==='ArrowLeft'){e.preventDefault();await moveSlide(-1);}if(e.key.toLowerCase()==='g')await gridModal();if(e.key.toLowerCase()==='p')printSlides();}if(isTeacher()&&route==='admin'&&adminTab==='control'){if(e.key==='ArrowRight')await setTeacherSlide(teacherSlide()+1);if(e.key==='ArrowLeft')await setTeacherSlide(teacherSlide()-1);}}));
// A running timer is calculated from an absolute end time, not decremented ticks.
setInterval(tickTimers,250);
render();
if(cloud)cloud.start(defaults());else toast('온라인 연결을 불러오지 못했습니다. 슬라이드와 게임만 사용할 수 있습니다.');
})();

</script>
